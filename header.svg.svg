<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
    <defs>
        <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" shape-rendering="crispEdges" />
        </pattern>

        <linearGradient id="neonGradient" x1="250" y1="0" x2="745" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#9d4edd" />
            <stop offset="50%" stop-color="#3a0ca3" />
            <stop offset="100%" stop-color="#00f5ff" />
        </linearGradient>

        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur1" />
            <feGaussianBlur stdDeviation="8" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="simple-blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" />
        </filter>

        <clipPath id="clip-astronoceur">
            <rect x="90" y="25" width="0" height="30">
                <animate attributeName="width" values="0; 150" begin="0.5s" dur="0.8s" fill="freeze" calcMode="discrete" />
                <animate attributeName="width" values="0; 150" begin="0.5s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            </rect>
        </clipPath>

        <clipPath id="clip-init">
            <rect x="25" y="65" width="0" height="30">
                <animate attributeName="width" values="0; 300" begin="1.5s" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            </rect>
        </clipPath>

        <clipPath id="clip-main">
            <rect x="240" y="100" width="0" height="100">
                <animate attributeName="width" values="0; 520" begin="3.5s" dur="2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            </rect>
        </clipPath>
    </defs>

    <style>
        .terminal-text {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Monaco, Courier, monospace;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .title-text {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Monaco, Courier, monospace;
            font-size: 54px;
            font-weight: 900;
            letter-spacing: 4px;
            fill: #ffffff;
        }
        .constellation-line {
            stroke: #00f5ff;
            stroke-width: 1.2;
            opacity: 0.35;
        }
    </style>

    <rect width="1000" height="300" rx="16" fill="#070a13" />
    <rect width="1000" height="300" rx="16" fill="url(#grid)" />
    <rect width="998" height="298" x="1" y="1" rx="16" fill="none" stroke="#3a0ca3" stroke-width="1" opacity="0.4" />

    <g fill="#00f5ff">
        <circle cx="150" cy="240" r="1.5" opacity="0.2">
            <animate attributeName="opacity" values="0.1; 0.6; 0.1" dur="4s" begin="0s" repeatCount="indefinite" />
            <animate attributeName="cy" values="240; 230; 240" dur="9s" begin="0s" repeatCount="indefinite" />
        </circle>
        <circle cx="450" cy="60" r="1.5" opacity="0.1">
            <animate attributeName="opacity" values="0.1; 0.5; 0.1" dur="5s" begin="1s" repeatCount="indefinite" />
            <animate attributeName="cy" values="60; 75; 60" dur="11s" begin="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="850" cy="260" r="1" opacity="0.2">
            <animate attributeName="opacity" values="0.2; 0.7; 0.2" dur="3s" begin="2s" repeatCount="indefinite" />
            <animate attributeName="cy" values="260; 245; 260" dur="8s" begin="2s" repeatCount="indefinite" />
        </circle>
        <circle cx="650" cy="220" r="2" fill="#9d4edd" opacity="0.15">
            <animate attributeName="opacity" values="0.15; 0.4; 0.15" dur="6s" begin="0.5s" repeatCount="indefinite" />
            <animate attributeName="cy" values="220; 235; 220" dur="12s" begin="0s" repeatCount="indefinite" />
        </circle>
    </g>

    <circle cx="30" cy="40" r="6" fill="#ff5f56" />
    <circle cx="50" cy="40" r="6" fill="#ffbd2e" />
    <circle cx="70" cy="40" r="6" fill="#27c93f" />

    <text x="95" y="45" class="terminal-text" fill="#00f5ff" clip-path="url(#clip-astronoceur)">@astronoceur</text>
    
    <text x="30" y="85" class="terminal-text" fill="#8a99b5" clip-path="url(#clip-init)">&gt; initializing creative...</text>

    <g clip-path="url(#clip-main)">
        <text x="248" y="170" class="title-text" fill="none" stroke="#00f5ff" stroke-width="3" opacity="0.7" filter="url(#simple-blur)">LUIZA SCHIRMER</text>
        <text x="252" y="170" class="title-text" fill="none" stroke="#9d4edd" stroke-width="3" opacity="0.7" filter="url(#simple-blur)">LUIZA SCHIRMER</text>
        <text x="250" y="170" class="title-text">LUIZA SCHIRMER</text>
    </g>

    <line x1="250" y1="190" x2="745" y2="190" stroke="url(#neonGradient)" stroke-width="2" filter="url(#neon-glow)" opacity="0">
        <animate attributeName="opacity" values="0; 1" begin="3.5s" dur="0.2s" fill="freeze" />
        <animate attributeName="x2" values="250; 745" begin="3.5s" dur="2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
        <animate attributeName="opacity" values="1; 0.6; 1" begin="5.5s" dur="3s" repeatCount="indefinite" />
    </line>

    <line x1="250" y1="190" x2="745" y2="190" stroke="#ffffff" stroke-width="1" opacity="0">
        <animate attributeName="opacity" values="0; 0.8" begin="3.5s" dur="0.2s" fill="freeze" />
        <animate attributeName="x2" values="250; 745" begin="3.5s" dur="2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    </line>

    <g visibility="hidden">
        <set attributeName="visibility" to="visible" begin="3.4s" />
        <rect x="250" y="122" width="24" height="52" fill="#00f5ff">
            <animate attributeName="x" values="250; 755" begin="3.5s" dur="2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
            <animate attributeName="opacity" values="1; 0; 1" dur="0.8s" repeatCount="indefinite" />
        </rect>
    </g>

    <g transform="translate(760, 50)">
        <path d="M 20,40 L 60,30 L 110,45 L 160,25" class="constellation-line" />
        <path d="M 60,30 L 80,80 L 40,110 L 10,160" class="constellation-line" />
        <path d="M 80,80 L 120,120 L 170,100" class="constellation-line" />
        <path d="M 120,120 L 110,170" class="constellation-line" />
        <path d="M 40,110 L 80,150" class="constellation-line" />

        <g fill="#ffffff">
            <circle cx="60" cy="30" r="3.5" fill="#00f5ff" filter="url(#neon-glow)">
                <animate attributeName="r" values="3.5; 5; 3.5" dur="2s" repeatCount="indefinite" />
            </circle>
            <circle cx="80" cy="80" r="4" fill="#00f5ff" filter="url(#neon-glow)">
                <animate attributeName="opacity" values="1; 0.5; 1" dur="3s" begin="1s" repeatCount="indefinite" />
            </circle>
            <circle cx="120" cy="120" r="3.5" fill="#9d4edd" filter="url(#neon-glow)">
                <animate attributeName="r" values="3.5; 5; 3.5" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
            </circle>
            
            <circle cx="20" cy="40" r="2">
                <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" begin="0s" repeatCount="indefinite" />
            </circle>
            <circle cx="110" cy="45" r="2">
                <animate attributeName="opacity" values="0.3; 0.9; 0.3" dur="3.5s" begin="1s" repeatCount="indefinite" />
            </circle>
            <circle cx="160" cy="25" r="1.5">
                <animate attributeName="opacity" values="0.5; 1; 0.5" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="40" cy="110" r="2.5">
                <animate attributeName="opacity" values="0.2; 1; 0.2" dur="4s" begin="2s" repeatCount="indefinite" />
            </circle>
            <circle cx="10" cy="160" r="2">
                <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.5s" begin="1.5s" repeatCount="indefinite" />
            </circle>
            <circle cx="170" cy="100" r="2">
                <animate attributeName="opacity" values="0.3; 0.8; 0.3" dur="3s" begin="0.2s" repeatCount="indefinite" />
            </circle>
            <circle cx="110" cy="170" r="1.5">
                <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" begin="0.8s" repeatCount="indefinite" />
            </circle>
            <circle cx="80" cy="150" r="2">
                <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="3.5s" begin="1.2s" repeatCount="indefinite" />
            </circle>
        </g>
        
        <circle cx="80" cy="80" r="9" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.4">
            <animate attributeName="r" values="9; 12; 9" dur="3s" begin="1s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.4; 0; 0.4" dur="3s" begin="1s" repeatCount="indefinite" />
        </circle>
        <circle cx="120" cy="120" r="8" fill="none" stroke="#9d4edd" stroke-width="1" opacity="0.3">
            <animate attributeName="r" values="8; 11; 8" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.3; 0; 0.3" dur="2.5s" begin="0.5s" repeatCount="indefinite" />
        </circle>
    </g>

</svg>
